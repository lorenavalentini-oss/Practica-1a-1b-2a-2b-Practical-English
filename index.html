<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English File Elementary | 1A–2B + Practical English</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#203047;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}header{background:#173c65;color:#fff;padding:26px 18px}header>div,main{max-width:950px;margin:auto}h1{margin:0 0 7px;font-size:clamp(23px,4vw,34px)}header p{margin:0;color:#e1eaf8}main{padding:20px 14px 70px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}.tabs button,.control{background:#fff;border:2px solid #d3ddec;border-radius:12px;padding:12px 14px;cursor:pointer;font-size:15px;color:#203047}.tabs button.active{background:#173c65;color:#fff;border-color:#173c65}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 4px 22px #233a5a13}.hint{color:#5c6a80}.question{border:1px solid #dce3ee;border-radius:15px;padding:18px;margin:16px 0;background:#fcfdff}.question h3{font-size:17px;margin:0 0 13px}.option{display:block;width:100%;text-align:left;background:white;border:2px solid #dce3ee;border-radius:10px;padding:12px;margin:8px 0;font-size:16px;cursor:pointer;color:#233247}.option:hover,.option:focus-visible{border-color:#3670b0}.option.correct{background:#e3f8eb;border-color:#17814a}.option.wrong{background:#ffebeb;border-color:#c74242}.option:disabled{cursor:default;opacity:1}.feedback{margin-top:9px;font-weight:600}.good{color:#136d3d}.bad{color:#aa3030}.small{font-size:13px;color:#566780}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.score{font-weight:700;background:#eaf2fc;padding:10px 14px;border-radius:10px}.control{font-weight:650}.control.primary{background:#173c65;color:white;border-color:#173c65}.read{font-size:13px;padding:7px 10px;margin-bottom:7px;border:1px solid #cbd8ea;background:#f5f9ff;border-radius:8px;cursor:pointer}.progress{height:10px;background:#e2e9f2;border-radius:12px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:#24805c;transition:width .2s}.result{background:#eef5ff;border-radius:12px;padding:18px;margin:18px 0}button:focus-visible{outline:3px solid #f3ad2d;outline-offset:2px}@media(max-width:550px){.panel{padding:14px}.question{padding:12px}}
</style></head><body><header><div><h1>English File Elementary · Practice Lab</h1><p>Units 1A · 1B · 2A · 2B · Practical English | 50 multiple-choice questions</p></div></header><main><p class="hint">Choose one answer for each question. Get immediate feedback and a short explanation. Use 🔊 to hear the question and answers. You can retry any section.</p><nav class="tabs" id="tabs" aria-label="Choose a unit"></nav><section class="panel" id="content" aria-live="polite"></section></main><script>
const DATA={"1A · Welcome!": [["Choose the correct greeting.", ["Good morning!", "Good night!", "Goodbye!"], 0, "Use Good morning when you greet someone in the morning."], ["Complete: I ___ Ana.", ["is", "am", "are"], 1, "I am."], ["Complete: She ___ from Brazil.", ["are", "am", "is"], 2, "She is."], ["Choose the question.", ["What your name?", "What is your name?", "What are your name?"], 1, "What is your name?"], ["Complete: ___ you a student?", ["Is", "Am", "Are"], 2, "Are you...?"], ["Choose the negative.", ["I not am Italian.", "I am not Italian.", "I no Italian."], 1, "Put not after am."], ["Choose the short answer: Are you from Chile?", ["Yes, I is.", "Yes, I am.", "Yes, I are."], 1, "Yes, I am."], ["Choose the correct sentence.", ["They is teachers.", "They am teachers.", "They are teachers."], 2, "They are."], ["Complete: He ___ a doctor.", ["is", "are", "am"], 0, "He is."], ["Choose the correct reply: Nice to meet you.", ["I am 30.", "Nice to meet you, too.", "Good night."], 1, "Nice to meet you, too."]], "1B · Countries & people": [["She is from Argentina. She is ___.", ["Argentina", "Argentinian", "Argentine country"], 1, "A nationality adjective describes a person."], ["He is from Japan. He is ___.", ["Japan", "Japanish", "Japanese"], 2, "Japan → Japanese."], ["We ___ from Mexico.", ["am", "are", "is"], 1, "We are."], ["___ is your teacher?", ["Where", "Who", "How old"], 1, "Who asks about a person."], ["___ are you from?", ["What", "Where", "Who"], 1, "Where asks about a place."], ["Complete: My sister ___ 15.", ["are", "is", "am"], 1, "My sister = she."], ["Choose the plural.", ["countrys", "countryes", "countries"], 2, "Consonant + y → ies."], ["Choose the correct sentence.", ["My parents is Spanish.", "My parents are Spanish.", "My parents am Spanish."], 1, "Parents is plural."], ["What is the opposite of married?", ["single", "sister", "son"], 0, "Single means not married."], ["Complete: This is my father. ___ name is David.", ["Her", "His", "Their"], 1, "His refers to a man."]], "2A · Family & possessives": [["My mother’s son is my ___.", ["aunt", "brother", "grandmother"], 1, "Your mother’s son is your brother (or you)."], ["My father’s sister is my ___.", ["cousin", "aunt", "niece"], 1, "Your father’s sister is your aunt."], ["Choose: This is ___ book.", ["I", "me", "my"], 2, "My is a possessive adjective."], ["Choose: Maria and Luis are married. Luis is ___ husband.", ["his", "her", "their"], 1, "Her husband."], ["Complete: They live with ___ children.", ["his", "their", "our"], 1, "Their refers to they."], ["Choose the correct possessive.", ["Annas sister", "Anna’s sister", "Annas’ sister"], 1, "Singular possessive: Anna’s."], ["My brother’s daughter is my ___.", ["niece", "nephew", "uncle"], 0, "A niece is a brother’s or sister’s daughter."], ["___ are my grandparents.", ["He", "She", "They"], 2, "Grandparents is plural."], ["Choose: We are sisters. ___ mother is a nurse.", ["Our", "Their", "Her"], 0, "Our refers to we."], ["Which word means “hijo”?", ["sun", "son", "sister"], 1, "Son = hijo; sun = sol."]], "2B · Everyday English": [["___ you speak English?", ["Are", "Do", "Does"], 1, "Use do with you in Present Simple questions."], ["She ___ in Buenos Aires.", ["live", "lives", "living"], 1, "She + verb-s."], ["I ___ coffee in the morning.", ["drinks", "drink", "drinking"], 1, "I drink."], ["He ___ like tea.", ["don’t", "isn’t", "doesn’t"], 2, "He doesn’t + base verb."], ["___ your parents work?", ["Does", "Do", "Are"], 1, "Parents is plural: Do."], ["We ___ go to school on Sundays.", ["doesn’t", "not", "don’t"], 2, "We don’t + base verb."], ["What time ___ she start work?", ["do", "does", "is"], 1, "Does she start...?"], ["Choose the correct answer: Does he work here?", ["Yes, he do.", "Yes, he does.", "Yes, he is."], 1, "Short answer: he does."], ["Choose the correct order.", ["I get up usually at seven.", "I usually get up at seven.", "Usually I at seven get up."], 1, "Usually before the main verb."], ["They ___ TV after dinner.", ["watches", "watch", "watching"], 1, "They watch."]], "Practical English · Real-life conversations": [["You meet someone for the first time.", ["See you yesterday.", "Nice to meet you.", "I’m sorry for late."], 1, "A polite introduction."], ["Someone says “How are you?”", ["I’m from Spain.", "Fine, thanks. And you?", "My name is Ana."], 1, "A natural response."], ["Ask someone to repeat.", ["Repeat now.", "Could you repeat that, please?", "What you say?"], 1, "Polite request."], ["Ask for spelling.", ["How do you spell it?", "How you write?", "What is spelling?"], 0, "Use How do you spell it?"], ["At reception: “What’s your surname?”", ["I’m fine.", "Valentini.", "At ten."], 1, "Surname = last name."], ["Ask for a phone number.", ["Where’s your number?", "What’s your phone number?", "How old is your number?"], 1, "Phone number question."], ["You did not understand.", ["I not understand.", "Sorry, I don’t understand.", "I am no understand."], 1, "Don’t + understand."], ["Someone says “Thank you.”", ["You’re welcome.", "Good morning.", "I’m 20."], 0, "You’re welcome is a polite reply."], ["Say goodbye politely.", ["What’s your name?", "See you later!", "Where are you from?"], 1, "A natural goodbye."], ["Ask the price.", ["How many is it?", "How much is it?", "How old is it?"], 1, "How much for prices."]]};let active=0;const answers={};const titles=Object.keys(DATA);titles.forEach((_,i)=>answers[i]={});const tabs=document.getElementById('tabs'),content=document.getElementById('content');
function speak(text){if(!('speechSynthesis'in window)){alert('Speech is not available in this browser.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function render(){tabs.innerHTML='';titles.forEach((t,i)=>{let b=document.createElement('button');b.textContent=t;b.className=i===active?'active':'';b.setAttribute('aria-current',i===active?'page':'false');b.onclick=()=>{active=i;render();};tabs.append(b)});const qs=DATA[titles[active]],state=answers[active],done=Object.keys(state).length,correct=Object.entries(state).filter(([i,a])=>qs[+i][2]===a).length;content.innerHTML='';const heading=document.createElement('h2');heading.textContent=titles[active];content.append(heading);const tools=document.createElement('div');tools.className='toolbar';tools.innerHTML=`<span class="score">Score: ${correct} / ${qs.length}</span><span class="small">Answered: ${done} / ${qs.length}</span>`;let retry=document.createElement('button');retry.className='control';retry.textContent='↻ Try this unit again';retry.onclick=()=>{answers[active]={};render()};tools.append(retry);content.append(tools);const progress=document.createElement('div');progress.className='progress';progress.innerHTML=`<div style="width:${done/qs.length*100}%"></div>`;content.append(progress);
qs.forEach((q,i)=>{let box=document.createElement('article');box.className='question';let h=document.createElement('h3');h.textContent=`${i+1}. ${q[0]}`;box.append(h);let read=document.createElement('button');read.className='read';read.textContent='🔊 Listen';read.setAttribute('aria-label',`Listen to question ${i+1}`);read.onclick=()=>speak(q[0]+'. '+q[1].join('. '));box.append(read);q[1].forEach((option,j)=>{let btn=document.createElement('button');btn.className='option';btn.textContent=`${String.fromCharCode(65+j)}. ${option}`;if(state[i]!==undefined){btn.disabled=true;if(j===q[2])btn.classList.add('correct');else if(j===state[i])btn.classList.add('wrong')}btn.onclick=()=>{state[i]=j;render();document.getElementsByClassName('question')[i]?.scrollIntoView({block:'nearest'})};box.append(btn)});if(state[i]!==undefined){let fb=document.createElement('p');let ok=state[i]===q[2];fb.className='feedback '+(ok?'good':'bad');fb.textContent=(ok?'✓ Correct! ':'✗ Not quite. Correct answer: '+q[1][q[2]]+'. ')+q[3];box.append(fb)}content.append(box)});
if(done===qs.length){let res=document.createElement('div');res.className='result';res.innerHTML=`<h3>Unit complete! 🎉</h3><p>You got <strong>${correct} out of ${qs.length}</strong> (${Math.round(correct/qs.length*100)}%).</p><p>${correct===qs.length?'Excellent work!': 'Review the explanations above and try again.'}</p>`;content.append(res)}let footer=document.createElement('div');footer.className='toolbar';let next=document.createElement('button');next.className='control primary';next.textContent=active===titles.length-1?'Back to Unit 1A →':'Next section →';next.onclick=()=>{active=(active+1)%titles.length;render();window.scrollTo(0,0)};footer.append(next);content.append(footer)}render();
</script></body></html>
